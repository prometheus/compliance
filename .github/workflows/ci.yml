---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: alert_generator
          - directory: promql
          - directory: promqle2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "${RUNNER_TEMP}/test-reports/${{ matrix.directory }}"
          gotestsum --junitfile "${RUNNER_TEMP}/test-reports/${{ matrix.directory }}/unit-tests.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: test-results-${{ matrix.directory }}
          path: ${{ runner.temp }}/test-reports/${{ matrix.directory }}/unit-tests.xml

  golangci:
    name: lint (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: alert_generator
          - directory: promql
          - directory: promqle2e
          - directory: remotewrite/receiver
          - directory: remotewrite/sender
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          args: --verbose ./...
          version: v2.11.4
          working-directory: ${{ matrix.directory }}
