---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: alert_generator
          - directory: promql
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.26.x
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.2

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "${RUNNER_TEMP}/test-reports/${{ matrix.directory }}"
          gotestsum --junitfile "${RUNNER_TEMP}/test-reports/${{ matrix.directory }}/unit-tests.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: test-results-${{ matrix.directory }}
          path: ${{ runner.temp }}/test-reports/${{ matrix.directory }}/unit-tests.xml

  golangci:
    name: lint (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: alert_generator
          - directory: promql
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.26.x
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          args: --verbose ./...
          version: v2.11.4
          working-directory: ${{ matrix.directory }}
