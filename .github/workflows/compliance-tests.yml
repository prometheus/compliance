---
name: Compliance
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  remotewrite-sender:
    name: Remote Write Sender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x

      - run: cd remotewrite && make sender PROMETHEUS_RW_COMPLIANCE_SKIP_TEST_RE="\"${SKIP_TESTS}\""
        env:
          # Skip stateless exemplar coalescing (https://github.com/prometheus/prometheus/pull/20070) and untyped metadata inference (https://github.com/prometheus/proposals/pull/104) until implemented in Prometheus.
          SKIP_TESTS: "TestCompliance/prometheus/exemplars/rw2-stateless.*/(counter_|histogram_|exemplar_)|TestCompliance/prometheus/metadata/rw2-stateless.*/untyped_metadata_inferred"
